<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel = "stylesheet" href = "style.css"/>
</head>
<body>
    <div class="conatiner">
        <div class="card">
            <div class="image"></div>
            <h3 class="product-name">Wireless Headphones</h3>
            <p class="product-description">
                Premium sound quality with actve noise cancellation and 40-hour
                battery life
            </p>
            <strong><p class="price">$89.99</p></strong>
            <button class="cta">Add to Cart</button>
        </div>
    </div>
</body>
</html>
